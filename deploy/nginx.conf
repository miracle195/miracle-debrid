# /etc/nginx/sites-available/miracle-debrid
#
# TLS terminator in front of the Node process. Stremio's *web* player refuses
# plain-HTTP addons on a non-localhost host, so if you want to use it from
# app.strem.io (or from a phone), you need this plus a real certificate:
#
#   sudo certbot --nginx -d debrid.example.com
#
# The Stremio desktop and Android apps are happy with plain http:// on a LAN
# address, so this whole file is optional for a purely local setup.

upstream miracle_debrid {
    server 127.0.0.1:11470;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name debrid.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name debrid.example.com;

    ssl_certificate     /etc/letsencrypt/live/debrid.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/debrid.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Video responses are large; nothing here should ever be buffered to disk
    # or capped by a body-size limit.
    client_max_body_size 1m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    # A film can stream for hours on one connection.
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 30s;

    # Do not let nginx rewrite or strip range handling.
    proxy_force_ranges on;
    proxy_http_version 1.1;

    access_log /var/log/nginx/miracle-debrid.access.log;
    error_log  /var/log/nginx/miracle-debrid.error.log warn;

    location / {
        proxy_pass http://miracle_debrid;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_set_header Connection        "";
    }
}
