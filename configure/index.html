<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configure Miracle Debrid</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #161b22;
        --panel-sub: #1c2230;
        --line: #2a3140;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4c8dff;
        --good: #3fb950;
        --bad: #f85149;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        max-width: 560px;
        width: 100%;
        padding: 30px;
        text-align: center;
        box-shadow: 0 12px 35px rgba(0,0,0,0.55);
      }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.01em; }
      p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
      .badge {
        display: inline-block;
        padding: 5px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 22px;
        background: #21262d;
        color: var(--muted);
        border: 1px solid var(--line);
      }
      .badge.online { background: rgba(63, 185, 80, 0.15); color: var(--good); border-color: rgba(63, 185, 80, 0.35); }
      .badge.offline { background: rgba(248, 81, 73, 0.15); color: var(--bad); border-color: rgba(248, 81, 73, 0.35); }
      .btn {
        display: block;
        width: 100%;
        padding: 12px 18px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 10px;
        border: 0;
        cursor: pointer;
        font-size: 15px;
        transition: filter 0.2s;
      }
      .btn:hover { filter: brightness(1.1); }
      .btn.secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .row input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        color: var(--text);
        font-size: 13px;
        font-family: ui-monospace, Menlo, monospace;
      }
      .row button {
        padding: 8px 14px;
        background: var(--panel-sub);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .row button:hover {
        background: var(--line);
      }
      code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        background: var(--panel-sub);
        padding: 3px 8px;
        border-radius: 5px;
        word-break: break-all;
      }
      .info-box {
        margin-top: 22px;
        padding: 16px;
        border-radius: 8px;
        background: #11151c;
        border: 1px solid var(--line);
        text-align: left;
        font-size: 13px;
      }
      .info-box div + div { margin-top: 8px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Miracle Debrid Configuration</h1>
      <p>Routes directly to your local computer running Miracle Debrid.</p>

      <div class="badge" id="statusBadge">Checking connection to your computer...</div>

      <div id="actions">
        <a id="stremioBtn" class="btn" href="#">Open in Stremio</a>
        <button id="copyBtn" class="btn secondary">Copy Stremio Install Link</button>
        <a id="webBtn" class="btn secondary" href="#">Open Web Dashboard on Computer</a>
      </div>

      <div class="info-box">
        <div><b>Computer Name:</b> <code id="hostName">desktop-2povfrl.local</code></div>
        <div><b>Local Address:</b> <code id="localUrl">http://desktop-2povfrl.local:11470</code></div>
        <div style="margin-top: 14px;">
          <label>Host or IP Address:</label>
          <div class="row">
            <input id="customHost" type="text" value="desktop-2povfrl.local:11470" />
            <button id="testBtn">Test Connection</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const DEFAULT_HOST = 'desktop-2povfrl.local:11470';
      const FALLBACK_IP = '192.168.100.2:11470';
      const TOKEN = '198d93aa73665d012157b38a718ab7b4';

      let currentHost = localStorage.getItem('md_host') || DEFAULT_HOST;
      document.getElementById('customHost').value = currentHost;

      function updateUrls(host) {
        currentHost = host;
        localStorage.setItem('md_host', host);
        const stremioUrl = `stremio://${host}/${TOKEN}/manifest.json`;
        const dashboardUrl = `http://${host}/`;
        document.getElementById('stremioBtn').href = stremioUrl;
        document.getElementById('webBtn').href = dashboardUrl;
        document.getElementById('localUrl').textContent = `http://${host}`;
        document.getElementById('hostName').textContent = host.split(':')[0];
      }

      async function testHost(host) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 1600);
          const res = await fetch(`http://${host}/health`, { signal: controller.signal, mode: 'cors' });
          clearTimeout(timer);
          return res.ok;
        } catch {
          return false;
        }
      }

      async function checkServer() {
        const badge = document.getElementById('statusBadge');
        badge.className = 'badge';
        badge.textContent = 'Checking connection...';

        const custom = document.getElementById('customHost').value.trim();
        const hosts = [custom, DEFAULT_HOST, FALLBACK_IP, '127.0.0.1:11470'].filter(Boolean);
        const checked = new Set();

        for (const host of hosts) {
          if (checked.has(host)) continue;
          checked.add(host);
          if (await testHost(host)) {
            badge.textContent = `Computer Connected (${host})`;
            badge.className = 'badge online';
            updateUrls(host);
            return;
          }
        }

        badge.textContent = 'Server Offline — Double-click start.bat on your PC';
        badge.className = 'badge offline';
        updateUrls(custom || DEFAULT_HOST);
      }

      document.getElementById('testBtn').onclick = () => {
        checkServer();
      };

      document.getElementById('copyBtn').onclick = () => {
        const url = `http://${currentHost}/${TOKEN}/manifest.json`;
        navigator.clipboard.writeText(url).then(() => {
          const btn = document.getElementById('copyBtn');
          btn.textContent = 'Copied to Clipboard!';
          setTimeout(() => (btn.textContent = 'Copy Stremio Install Link'), 1500);
        });
      };

      updateUrls(currentHost);
      checkServer();
    </script>
  </body>
</html>
